# BandiRadar — https://bandiradarseizury.duckdns.org
#
#   /       dashboard (rebuilt by every daily run), behind basic auth (user "seizury")
#   /mcp    MCP server for Claude, behind its own bearer token (MCP_TOKEN)
#
# The code is the BandiRadar submodule, bind-mounted read-only: `git pull` there +
# `docker compose restart` updates it. Rebuild (`up -d --build`) only when its
# requirements.txt changes. All runtime state (DB, documents, reports, dashboard,
# logs) lives in ./state through BANDI_HOME — never inside the submodule.
#
# Setup: cp .env.example .env, fill it in, then
#   sudo chown -R ${PUID:-1000}:${PGID:-1000} state     # containers run as this user
#   docker compose up -d --build

x-bandi: &bandi
  build: ./BandiRadar
  image: bandiradar:latest
  user: "${PUID:-1000}:${PGID:-1000}"
  security_opt:
    - no-new-privileges:true
  working_dir: /app
  networks:
    - homeserver

services:
  bandi-scraper:
    <<: *bandi
    container_name: bandi-scraper
    restart: unless-stopped
    command: ["python", "-m", "bandi.scheduler"]   # daily run at BANDI_RUN_AT; rebuilds the dashboard on start
    env_file: .env                                 # Ollama keys + MCP_TOKEN (for the Connect Claude button)
    environment:
      TZ: Europe/Rome
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      BANDI_HOME: /state
      BANDI_RUN_AT: ${BANDI_RUN_AT:-07:00}
      BANDI_PUBLIC_URL: https://bandiradarseizury.duckdns.org
      BANDI_DASHBOARD_TOKEN: "1"                   # the dashboard is password-protected, so it may show the token
    volumes:
      - ./BandiRadar:/app:ro
      - ./state:/state
    shm_size: 1gb                                  # headless Chromium crashes with Docker's default 64 MB /dev/shm

  bandi-mcp:
    <<: *bandi
    container_name: bandi-mcp
    restart: unless-stopped
    depends_on:
      - bandi-scraper                              # same image
    command: ["python", "-m", "bandi.mcp_server"]
    environment:
      TZ: Europe/Rome
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      BANDI_HOME: /state
      MCP_TRANSPORT: http
      MCP_PORT: "8000"
      MCP_TOKEN: ${MCP_TOKEN:?set MCP_TOKEN in .env}
      MCP_ALLOWED_HOSTS: bandiradarseizury.duckdns.org
    volumes:
      - ./BandiRadar:/app:ro
      - ./state:/state                             # the server only opens the DB read-only
    labels:
      caddy: bandiradarseizury.duckdns.org
      caddy.reverse_proxy: "/mcp* {{upstreams 8000}}"

  bandi-web:
    image: nginx:alpine
    container_name: bandi-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./state/dashboard:/usr/share/nginx/html:ro
      - ./BandiRadar/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      caddy: bandiradarseizury.duckdns.org
      caddy.reverse_proxy: "{{upstreams 80}}"
      # Basic auth on everything except /mcp (which checks its own bearer token).
      caddy.@dashboard.not: "path /mcp*"
      caddy.basic_auth: "@dashboard"
      caddy.basic_auth.seizury: "${BANDI_DASH_HASH:?set BANDI_DASH_HASH in .env}"
    networks:
      - homeserver

networks:
  homeserver:
    external: true
