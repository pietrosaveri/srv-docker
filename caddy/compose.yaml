services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.9-alpine

    container_name: caddy

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    environment:
      - CADDY_INGRESS_NETWORKS=homeserver

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/data
      - ./config:/config

    networks:
      - homeserver

networks:
  homeserver:
    external: true
