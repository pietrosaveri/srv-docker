services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    user: "1000:1000"
    
    volumes:
      - /srv:/srv
      - ./database:/database

    command:
      - --root=/srv
      - --database=/database/filebrowser.db

    networks:
      - homeserver

    labels:
      caddy: files.home.arpa
      caddy.tls: internal
      caddy.reverse_proxy: "{{upstreams 80}}"

networks:
  homeserver:
    external: true
