services:
  glances:
    image: nicolargo/glances:latest
    container_name: glances

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    pid: host

    ports:
      - "61208:61208"

    environment:
      GLANCES_OPT: "-w"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - homeserver

networks:
  homeserver:
    external: true
