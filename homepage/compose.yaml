services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    ports:
      - "3000:3000"

    environment:
      PUID: 1000
      PGID: 1000
      HOMEPAGE_ALLOWED_HOSTS: mmserver:3000,localhost:3000,127.0.0.1:3000
      
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - homeserver

networks:
  homeserver:
    external: true
