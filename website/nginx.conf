server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # mermaid.min.js is ~3.4 MB uncompressed; gzip takes it to roughly 900 KB
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    # vendored library is version-pinned, so let clients keep it
    location /js/vendor/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # This is a static multi-page site, not an SPA. The old
    # `try_files $uri $uri/ /index.html` returned index.html with a 200 for
    # EVERY missing path, so /favicon.ico, /sw.js, /manifest.json and
    # /apple-touch-icon.png (all of which browsers request on their own)
    # answered with HTML. A real 404 is correct here, and it also lets a
    # browser drop any stale service worker previously registered on this
    # origin: an SW script that 404s gets unregistered, whereas one that
    # returns HTML just fails its update check and stays active.
    location / {
        try_files $uri $uri/ =404;
    }
}