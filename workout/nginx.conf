server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/html text/css application/javascript;

    # Single static page, nothing else to serve.
    location / {
        try_files $uri $uri/ =404;
    }
}
